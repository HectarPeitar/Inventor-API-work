<SCRIPT LANGUAGE="JSCRIPT">

var xmlDoc =new ActiveXObject ("Msxml2.DOMDocument") ;

var tab_array =new Array () ;
tab_array [0] =Default ;
tab_array [1] =InvEvents ;
tab_array [2] =Options ;

function InitDocument (document) {
	setDirection () ;
	if ( window.external.FindSymbol ("DOCUMENT_FIRST_LOAD") )
		window.external.SetDefaults (document) ;
	window.external.Load (document) ;
	
	//- Init and load the XML
	xmlDoc.load ("invevents.xml") ;
	//- Populate the base class drop down list
	PopulateEventList () ;
}

//- Populate the base drop down list
function PopulateEventList () {
	//- Read from an XML file (create a dom document)
	var moNodListExpert =xmlDoc.selectSingleNode (".//Expert") ;
	var moNodList =xmlDoc.selectNodes (".//event") ;
	for ( var nCtr =0 ; nCtr < moNodList.length ; nCtr++ ) {
		var msEvent =moNodList.item (nCtr).getAttribute ("name") ;
		var msHide =moNodList.item (nCtr).getAttribute ("hide") ;
		if ( msHide != 'true' || moNodListExpert != null ) {
			var oOption =document.createElement ("OPTION") ;
			oOption.text =msEvent ;
			oOption.value =msEvent ;
			SINKCLASSNAME.add (oOption) ;
		}
	}
	//- Sets default
	SINKCLASSNAME.selectedIndex =0 ;
	var selectedItem =window.external.FindSymbol ("SINKCLASSNAME") ;
	if ( selectedItem != "" ) {
		for ( var i =0 ; i < SINKCLASSNAME.length ; i++ ) {
			if ( SINKCLASSNAME.options [i].text == selectedItem ) {
				SINKCLASSNAME.selectedIndex =i ;
				break ;
			}
		}
	}	
}

function ValidateInput () {
	var moNodList =xmlDoc.selectNodes (".//event[@name ='" + SINKCLASSNAME.options [SINKCLASSNAME.selectedIndex].text + "']") ;
	var sinkType =moNodList.item (0).getAttribute ("typeint") ;
	window.external.AddSymbol ("INTERFACETYPE", sinkType) ;
	if ( sinkType == "IDispatch" ) {
		window.external.AddSymbol ("INTERFACE_DUAL", true) ;
		window.external.AddSymbol ("INTERFACE_CUSTOM", false) ;
	} else {
		window.external.AddSymbol ("INTERFACE_DUAL", false) ;
		window.external.AddSymbol ("INTERFACE_CUSTOM", true) ;
	}
	return (true) ;
}

function Next (document, linkto) {
	ValidateInput () ;
	window.external.Next (document, linkto) ;
}

function OnFinish (document) {
	ValidateInput () ;
	if ( window.external.FindSymbol ("SHORT_NAME").length == 0 ) {
		var L_ErrMsg1_Text ="Need to specify a short name." ;
		window.external.ReportError (L_ErrMsg1_Text) ;
		Next (document, "default.htm") ;
		return ;
	}
	if ( window.external.FindSymbol ("ATTRIBUTED") == true )
		if ( !ConvertProjectToAttributed () )
			return ;
	OnWizFinish (document) ;
}
